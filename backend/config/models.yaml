# TokenMaxx routing config — read by services/config_loader.py
#
# Chat models are restricted to GROQ_CHAT_MODEL_IDS in model_registry.py
# (6 Groq chat models + whisper-large-v3 for audio only).
#
# This file defines:
#   - task_profiles: how to weight capability scores per task type
#   - auxiliary: lightweight models for enhancer / title / classifier
#   - premium_baseline: savings comparison reference
#
# To change which Groq models are available: edit GROQ_MODEL_ALLOWLIST in model_registry.py.

# Task types the prompt analyzer may assign (keys must match task_profiles)
default_task: general_qa

task_profiles:
  general_qa:
    description: Everyday questions and short answers.
    task_match_weights:
      coding: 0.15
      reasoning: 0.40
      writing: 0.45

  coding:
    description: Programming, debugging, and technical tasks.
    task_match_weights:
      coding: 0.70
      reasoning: 0.20
      writing: 0.10

  reasoning:
    description: Logic, inference, and multi-step thinking.
    task_match_weights:
      coding: 0.15
      reasoning: 0.70
      writing: 0.15

  writing:
    description: Editing, composition, and prose.
    task_match_weights:
      coding: 0.05
      reasoning: 0.25
      writing: 0.70

  summarization:
    description: Condensing content into shorter form.
    task_match_weights:
      coding: 0.05
      reasoning: 0.30
      writing: 0.65

  math:
    description: Calculations, equations, and quantitative problems.
    task_match_weights:
      coding: 0.20
      reasoning: 0.65
      writing: 0.15

  research:
    description: Analysis, studies, and data-oriented questions.
    task_match_weights:
      coding: 0.15
      reasoning: 0.45
      writing: 0.40

  creative:
    description: Stories, poems, and imaginative content.
    task_match_weights:
      coding: 0.05
      reasoning: 0.20
      writing: 0.75

  report:
    description: Reports, briefings, and long-form structured writing.
    task_match_weights:
      coding: 0.05
      reasoning: 0.35
      writing: 0.60
    scoring_weights:
      task: 0.42
      reasoning: 0.28
      writing: 0.20
      cost: 0.05
      speed: 0.05

  business:
    description: Strategic business, executive planning, RFPs, and enterprise analysis.
    task_match_weights:
      coding: 0.05
      reasoning: 0.45
      writing: 0.50
    scoring_weights:
      task: 0.45
      reasoning: 0.25
      writing: 0.20
      cost: 0.05
      speed: 0.05

  classification:
    description: Labeling, categorization, and tagging tasks.
    task_match_weights:
      coding: 0.20
      reasoning: 0.50
      writing: 0.30

  flashcards:
    description: Simple educational content — favor writing quality.
    task_match_weights:
      coding: 0.10
      reasoning: 0.25
      writing: 0.65

  web_research:
    description: Live web search, current events, pricing, and fresh documentation.
    task_match_weights:
      coding: 0.10
      reasoning: 0.45
      writing: 0.45
    preferred_models:
      - openai/gpt-oss-120b
      - llama-3.3-70b-versatile
      - qwen/qwen3-32b

# Map legacy analyzer outputs to task profile keys
task_aliases:
  creative_writing: creative
  data_analysis: research
  translation: general_qa
  business: business

# Small/fast models for non-routing Groq calls (not scored by the router)
auxiliary:
  classifier: llama-3.1-8b-instant
  enhancer: llama-3.1-8b-instant
  title: llama-3.1-8b-instant

# Premium baseline for savings comparison (not used for routing)
premium_baseline:
  label: GPT-4o (Premium)
  input_per_1k: 0.005
  output_per_1k: 0.015
