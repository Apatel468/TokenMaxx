# TokenMaxx routing config — read by services/config_loader.py
#
# Chat models are restricted to GROQ_CHAT_MODEL_IDS in model_registry.py
# (6 Groq chat models + whisper-large-v3 for audio only).
#
# This file defines:
#   - task_profiles: how to weight capability scores per task type
#   - auxiliary: lightweight models for enhancer / title / classifier
#   - premium_baseline: savings comparison reference
#
# To change which Groq models are available: edit GROQ_MODEL_ALLOWLIST in model_registry.py.

# Task types the prompt analyzer may assign (keys must match task_profiles)
default_task: general_qa

task_profiles:
  flashcards:
    description: Simple educational content — favor writing quality.
    task_match_weights:
      coding: 0.10
      reasoning: 0.25
      writing: 0.65

  coding:
    description: Programming, debugging, and technical tasks.
    task_match_weights:
      coding: 0.70
      reasoning: 0.20
      writing: 0.10

  general_qa:
    description: Everyday questions and short answers.
    task_match_weights:
      coding: 0.15
      reasoning: 0.40
      writing: 0.45

  report:
    description: Reports, summaries, and long-form writing.
    task_match_weights:
      coding: 0.10
      reasoning: 0.30
      writing: 0.60

# Map analyzer outputs not listed above to a task profile key
task_aliases:
  summarization: report
  creative_writing: report
  data_analysis: report
  translation: general_qa

# Small/fast models for non-routing Groq calls (not scored by the router)
auxiliary:
  classifier: llama-3.1-8b-instant
  enhancer: llama-3.1-8b-instant
  title: llama-3.1-8b-instant

# Premium baseline for savings comparison (not used for routing)
premium_baseline:
  label: GPT-4o (Premium)
  input_per_1k: 0.005
  output_per_1k: 0.015
